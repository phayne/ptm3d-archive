# Moon3D R1 benchmark engine template (C2). Physics = the Moon3D native config
# (runs/stage3/configs/moon3d_lat_native_coupled_v4stage3.yaml): one lunation,
# 360 output steps, 2 spin-up orbits, Moon3D regolith. run_bench.py fills every
# field marked FILLED and applies the per-run overrides from the plan.
simulation:
  start_time: '2030-09-01T00:00:00'
  duration_days: 29.53
  timesteps: 360
  body: Moon
mesh:
  resolution: 9
  import_file: FILLED
  scale_factor: 1.0
  export_basic: false
  use_topographic: false
thermal:
  run_thermal_mesh: true
  threads: 0
  equilibration_orbits: 2
  equilibration_steps_per_day: -1.0
  equilibration_samples_per_diurnal_cycle: 120.0
  use_gpu: false
  gpu_devices: 1
  compute_statistics: true
  thermal_inertia_map: ''
  h_parameter_map: ''
  use_default_property_map: false
  property_maps_directory: data/property_maps
  enable_shadow_flux: false
  crater_dd_ratio: 8.0
  integration_days: -1.0
  integration_steps: -1
  integration_offset_days: 0.0
  integration_offset_steps: 0
  geothermal_heat_flow: 0.022
# No `thermophysical:` block: on the built-in Moon every key in it is read by
# nothing (the engine says so at startup; PTM-67). The Moon3D native config
# carries one; it is decorative there too. Body defaults apply.
radiation:
  enabled: true
  min_shadow_fraction: 0.8
  verbose: false
  use_gpu: false
  view_factor_file: FILLED
  max_coupling_iterations: 16
  coupling_temp_threshold: 2.0
  coupling_flux_threshold: 0.1
  coupling_face_fraction: 0.01
  use_hmatrix: true
  use_aca: true
  aca_tolerance: 0.001
  aca_max_rank: 50
  hmatrix_threads: 0
  adaptive_neighbors: true
  captured_energy_target: 0.95
  max_neighbors: 500
  min_neighbors: 20
illumination:
  include_primary_reflection: true
  use_batch_processing: true
  albedo_map: ''
  positions_file: ''
  use_albedo_map: false
output:
  directory: FILLED
  format: binary
  vtk_mode: thermal
  include_primary_ir: true
  thermal_vtk_file: ''
  complete_vtk_file: ''
  locations_file: ''
  series_output: ''
  location_data: ''
  no_maps: false
advanced:
  verbose: true
  default_visible_albedo: -1.0
visualization:
  create: false
