# Tutorial 04 (control): lunar 80N bowl crater, radiation exchange OFF.
# Companion to tutorial04_crater80N_coupled.yaml — run both and compare
# crater-floor temperatures (docs/tutorials/04_crater_radiosity.md).
# Run from the repo root after `python3 scripts/fetch_kernels.py`.

simulation:
  start_time: '2026-04-05T00:00:00'
  duration_days: 29.53
  timesteps: 118                 # ~6 h cadence over one lunation
  body: Moon
mesh:
  resolution: 3
  import_file: data/meshes/lunar_crater_80N.ply   # 12,800 faces, shipped with the repo
  scale_factor: 1.0
  use_topographic: false
thermal:
  run_thermal_mesh: true
  threads: 0
  equilibration_orbits: 1.0
  equilibration_steps_per_day: -1.0
  use_gpu: false
  compute_statistics: true
  enable_shadow_flux: false
  crater_dd_ratio: 8.0
  geothermal_heat_flow: -1.0
thermophysical:
  use_default_albedo: true
  albedo: 0.12
  use_default_emissivity: true
  emissivity: 0.95
  incidence_angle_albedo: true
radiation:
  enabled: false                 # <- the control: no inter-face radiation
illumination:
  include_primary_reflection: true
  use_batch_processing: true
  use_albedo_map: false
output:
  directory: output/tutorial04_crater80N_radoff
  format: binary
  vtk_mode: thermal
advanced:
  verbose: false
