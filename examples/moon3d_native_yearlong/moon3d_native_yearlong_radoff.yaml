# Moon3D year-long simulation (one full year, 2030-09-01 to 2031-09-01) of the
# 509,337-face Moon3D testbed crater mesh placed at the IM-2 landing site.
# These are the settings of the year-long runs for the Moon3D paper; only
# machine paths are replaced by repository-relative ones. Read
# examples/moon3d_native_yearlong/README.md before running: the mesh and the
# view-factor matrix are not distributed, and the run takes days.
# Radiation-off companion run: identical except radiation.enabled.

# The validated fine-mesh illumination settings. They are opt-in (default OFF)
# and are always used together; never set PTM_ILLUM_RISE_EPS on its own.
# See docs/ENVIRONMENT.md.
engine_env:
  PTM_ILLUM_TRUE_NORMALS: '1'
  PTM_ILLUM_RISE_EPS: '1'
  PTM_ILLUM_RISE_KEPS: '0.2'
  PTM_ILLUM_RISE_HABS: '0'
  PTM_ILLUM_SEAL_HOLES: '1'

simulation:
  start_time: '2030-09-01T00:00:00'
  duration_days: 365.25
  timesteps: 1484                 # ~6 h output cadence
  body: Moon
mesh:
  # Not distributed (see the README). Resolved against $PTM_DATA_ROOT, then <repo>/data.
  import_file: data/meshes/moon3d_c_cartesian_NEW_500k_clean_native.ply
thermal:
  run_thermal_mesh: true
  threads: 0
  equilibration_orbits: 8         # integrated diurnal cycles of spin-up
  equilibration_samples_per_diurnal_cycle: 120
  thermal_m: 10
  thermal_b: 32                   # deeper than the default 15, for the annual wave
  use_gpu: false                  # the Moon3D paper's runs used the CPU solver
  compute_statistics: true
  # Basal heat flow 0.022 W/m^2, the value used by the Moon3D paper's runs.
  # (The engine's lunar default is 0.018 W/m^2, Langseth et al. 1976.)
  geothermal_heat_flow: 0.022
thermophysical:
  incidence_angle_albedo: true
radiation:
  enabled: false
  use_gpu: false
  max_coupling_iterations: 16
  coupling_temp_threshold: 2.0
  coupling_flux_threshold: 0.1
  coupling_face_fraction: 0.01
  min_shadow_fraction: 0.8
  use_hmatrix: true
  use_aca: true
  aca_tolerance: 0.001
  aca_max_rank: 50
  adaptive_neighbors: true
  captured_energy_target: 0.95
  max_neighbors: 500
  min_neighbors: 20
illumination:
  include_primary_reflection: true
  use_batch_processing: true
  use_albedo_map: false
output:
  directory: output/moon3d_native_yearlong/radoff
  format: binary
  include_primary_ir: true
  depths_file: data/locations/depths.txt
advanced:
  verbose: true
