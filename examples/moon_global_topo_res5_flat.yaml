# PTM3D companion control: the res-5 global Moon run WITHOUT topography.
#
# This file is the smooth-sphere run of a two-run comparison. It is a copy of
# examples/moon_global_topo_res5.yaml with exactly TWO keys changed:
#
#     mesh.use_topographic : true  -> false
#     output.directory     : .../moon_global_topo_res5
#                         -> .../moon_global_topo_res5_flat
#
# Everything else (epoch, duration, mesh resolution, property maps, albedo map,
# thermophysics) is byte-for-byte the same, so a face-by-face difference between
# the two output directories is attributable to the LOLA topography alone.
#
# Requires the same fetched datasets as its topographic twin:
#     python3 scripts/fetch_kernels.py --bodies moon
#     python3 scripts/fetch_data.py --core     # topo + property maps + albedo maps
#     ./build/bin/ptm_thermal_sim --config examples/moon_global_topo_res5_flat.yaml
#
# See docs/tutorials/notebooks/01_moon_diurnal.ipynb, section 7.

simulation:
  start_time: '2026-04-05T00:00:00'
  duration_days: 29.53
  timesteps: 240
  body: Moon
mesh:
  resolution: 5
  import_file: ''
  scale_factor: 1.0
  use_topographic: false        # <-- the one geometry change: mean sphere, no LOLA relief
  topo_directory: data/topo
thermal:
  run_thermal_mesh: true
  threads: 0
  equilibration_orbits: 1.0
  equilibration_steps_per_day: -1.0
  use_gpu: false
  compute_statistics: true
  use_default_property_map: true
  property_maps_directory: data/property_maps
  enable_shadow_flux: false
  crater_dd_ratio: 8.0
  geothermal_heat_flow: -1.0
thermophysical:
  use_default_albedo: true
  incidence_angle_albedo: true
radiation:
  enabled: false
illumination:
  include_primary_reflection: true
  use_batch_processing: true
  use_albedo_map: true
  albedo_maps_directory: data/albedo_maps
output:
  directory: output/moon_global_topo_res5_flat
  format: binary
  vtk_mode: none
advanced:
  verbose: false
