# Moon3D latitude-sweep re-run -- RADOFF (illumination-only, no radiation coupling; the
# no-coupling comparison pair for the two-band coupled run at the same latitude).
# Latitude tag: lat70 (crater placed at -70 deg, rigid-rotated from native).
# Derived from examples/moon3d_500k_clean.yaml (2026-07-12, Luna) -- ONLY mesh.import_file and
# output.directory changed. start_time/duration_days/equilibration UNCHANGED (see runbook for basis).
simulation:
  start_time: '2030-09-01T00:00:00'
  duration_days: 29.53
  timesteps: 360
  body: Moon
mesh:
  resolution: 9
  import_file: data/dem/moon3d_lat/moon3d_lat70.ply
  scale_factor: 1.0
  export_basic: false
  use_topographic: false
  topo_directory: data/topo
thermal:
  run_thermal_mesh: true
  threads: 0
  equilibration_orbits: 2
  equilibration_steps_per_day: -1.0
  equilibration_samples_per_diurnal_cycle: 120.0
  use_gpu: true
  gpu_devices: 2
  compute_statistics: true
  thermal_inertia_map: ''
  h_parameter_map: ''
  use_default_property_map: false
  property_maps_directory: data/property_maps
  enable_shadow_flux: false
  crater_dd_ratio: 8.0
  integration_days: -1.0
  integration_steps: -1
  integration_offset_days: 0.0
  integration_offset_steps: 0
  geothermal_heat_flow: 0.022
thermophysical:
  use_default_albedo: false
  albedo: 0.12
  use_default_emissivity: false
  emissivity: 0.95
  incidence_angle_albedo: true
  use_default_ks: false
  ks: 0.00074
  use_default_kd: false
  kd: 0.0034
  use_default_H: false
  H: 0.06
  use_default_rhos: false
  rhos: 1100.0
  use_default_rhod: false
  rhod: 1800.0
  use_default_cp0: false
  cp0: -3.6125
  use_default_Qb: false
  Qb: 0.02
  use_default_chi: true
  chi: 2.7
  constant_thermal_inertia: -1.0
radiation:
  enabled: false
  min_shadow_fraction: 0.8
  verbose: false
  use_gpu: true
  view_factor_file: data/external/moon3d/moon3d_c_cartesian_NEW_500k_clean.vf
  max_coupling_iterations: 5
  coupling_temp_threshold: 2.0
  coupling_flux_threshold: 0.1
  coupling_face_fraction: 0.01
  use_hmatrix: true
  use_aca: true
  aca_tolerance: 0.001
  aca_max_rank: 50
  hmatrix_threads: 0
  adaptive_neighbors: true
  captured_energy_target: 0.95
  max_neighbors: 500
  min_neighbors: 20
illumination:
  include_primary_reflection: true
  use_batch_processing: true
  albedo_map: ''
  albedo_maps_directory: data/albedo_maps
  positions_file: ''
  use_albedo_map: false
output:
  directory: output/moon3d_lat_twoband/lat70_radoff
  format: binary
  vtk_mode: thermal
  include_primary_ir: true
  thermal_vtk_file: ''
  complete_vtk_file: ''
  locations_file: ''
  depths_file: data/locations/depths.txt
  series_output: ''
  location_data: ''
  no_maps: false
advanced:
  verbose: true
  default_visible_albedo: -1.0
visualization:
  create: false
  width: 1024
  height: 768
  fps: 30
  camera_distance: 5.0
  camera_latitude: 30.0
  camera_longitude: 0.0
  emission_angle: -1.0
  azimuth: -1.0
  save_frames: false
