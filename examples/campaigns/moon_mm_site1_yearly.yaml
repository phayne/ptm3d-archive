simulation:
  start_time: '2026-01-01T00:00:00'
  duration_days: 365.25
  timesteps: 365                 # ~daily; ~30 samples/lunar-cycle, no aliasing of diurnal cycle
  body: Moon
mesh:
  resolution: 9                  # ignored when import_file is set
  import_file: data/dem/mons_mouton/mm_site1_84.367S_39.140E.ply
  scale_factor: 1.0
  use_topographic: false
thermal:
  run_thermal_mesh: true
  threads: 0
  use_gpu: true
  equilibration_orbits: 2.0
  equilibration_steps_per_day: -1.0
  equilibration_samples_per_diurnal_cycle: 120.0
  compute_statistics: true
  use_default_property_map: true
  property_maps_directory: data/property_maps
  thermal_inertia_map: ''
  h_parameter_map: ''
  compute_ice_stability: true        # Schorghofer & Taylor (2007) depth-resolved ice-stability output
  ice_stability:
    flux_threshold_kgm2s: 3.0e-14
    grain_hop_length_um: 75.0
    geothermal_gradient_K_per_m: 0.0
    sublimation_enthalpy_kJmol: 51.058
    n_depth_subsamples: -1
  enable_shadow_flux: false
  crater_dd_ratio: 8.0
  integration_days: -1.0         # default = output window (= duration_days)
  integration_steps: -1
  integration_offset_days: 0.0
  integration_offset_steps: 0
  geothermal_heat_flow: -1.0
thermophysical:
  use_default_albedo: true
  albedo: 0.12
  use_default_emissivity: true
  emissivity: 0.95
  incidence_angle_albedo: true
  use_default_ks: true
  ks: 0.00074
  use_default_kd: true
  kd: 0.0034
  use_default_H: true
  H: 0.06
  use_default_rhos: true
  rhos: 1100.0
  use_default_rhod: true
  rhod: 1800.0
  use_default_cp0: true
  cp0: 800.0
  use_default_Qb: true
  Qb: 0.018
  use_default_chi: true
  chi: 2.7
  constant_thermal_inertia: -1.0
radiation:
  enabled: false
illumination:
  include_primary_reflection: true
  use_batch_processing: true
  use_albedo_map: false
  albedo_map: ''
  positions_file: ''
output:
  directory: output/mm_site1_yearly
  format: binary
  vtk_mode: thermal
  include_primary_ir: false
  skip_time_series: true        # disk-only optimisation: write mesh + stats, skip 365 per-step files (~35 GB saved)
advanced:
  verbose: false
  default_visible_albedo: -1.0
