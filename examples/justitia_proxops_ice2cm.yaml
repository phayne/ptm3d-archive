# Paths below are REPOSITORY-ROOT-RELATIVE. The engine
# resolves a `data/...` value against the repository root, which it finds by
# walking up from THIS FILE's directory to the one holding
# data/data_manifest.json (src/cpp/tools/config_parser.cpp, findRepoRootForData
# / resolveDataPath), so these resolve from any working directory and honor
# $PTM_DATA_ROOT. They previously named an absolute OneDrive path that does not
# exist on every machine. Do not re-absolutize them.
#
# ONE EXCEPTION, and it is a real one: the paths INSIDE
# data/horizons_cache/bodies/269_Justitia_(A887_SA)/metakernel.tm are resolved
# by SPICE's furnsh_c against the CURRENT WORKING DIRECTORY, not by the engine.
# Launch this run from the repository root, or SPICE will not find the kernels
# the metakernel names.
simulation:
  start_time: '2035-09-30T00:00:00'
  duration_days: 2.0
  timesteps: 288
  body: 269 Justitia (A887 SA)
mesh:
  resolution: 5
  import_file: data/horizons_cache/bodies/269_Justitia_(A887_SA)/shape.obj
  scale_factor: 1.0
  export_basic: false
thermal:
  run_thermal_mesh: true
  threads: 0
  equilibration_orbits: 40.0
  equilibration_steps_per_day: -1.0
  equilibration_samples_per_diurnal_cycle: 30.0
  use_gpu: false
  compute_statistics: true
  thermal_inertia_map: ''
  h_parameter_map: ''
  use_default_property_map: false
  property_maps_directory: data/property_maps
  enable_shadow_flux: false
  crater_dd_ratio: 8.0
  integration_days: -1.0
  integration_steps: -1
  integration_offset_days: 0.0
  integration_offset_steps: 0
  geothermal_heat_flow: -1.0
  # DEPTH-GRID FIX : default thermal_m=10 catastrophically
  # under-resolves the near-surface ice boundary once kd/rhod jump to ice
  # values (deep thermal diffusivity ~400x the regolith surface value blows
  # up the adaptive-grid resolution target and the grid coarsens via the
  # hardcoded Rmax=2.0 geometric-growth cap almost immediately: only 3 grid
  # layers span 0->2cm at thermal_m=10). thermal_m=150 restores ~17 layers
  # up to the 2cm boundary (36 layers total to zmax~29cm) -- verified by
  # reproducing generateAdaptiveGrid() in Python against these exact
  # ks/kd/rhos/rhod/H/cp0/period values. See session note /memory for detail.
  thermal_m: 150
thermophysical:
  constant_thermal_inertia: 0.0
  use_default_albedo: false
  albedo: 0.03
  use_default_emissivity: false
  emissivity: 0.95
  incidence_angle_albedo: false
  use_default_ks: false
  ks: 0.01
  use_default_kd: false
  # kd/rhod/H below are an APPROXIMATION of a discrete regolith-over-ice
  # step at depth 2 cm, built from PTM3D's only depth-dependent-property
  # mechanism: the smooth two-layer profile k(z)=kd+(ks-kd)*exp(-z/H),
  # rho(z)=rhod+(rhos-rhod)*exp(-z/H). PTM3D has NO native discrete-step /
  # tabulated depth-profile capability (confirmed by source inspection of
  # thermal_model.h/.cpp and thermal_property_map.cpp) -- FLAGGED for
  # Fermi/Paul, see session note. kd=2.5 W/m/K, rhod=920 kg/m3 (bulk water
  # ice); H=0.02 m places the e-folding "center" of the transition AT the
  # requested 2cm depth (a convention choice, NOT a sharp step -- k(z) is
  # already ~22% ice-like by z=0.5cm and ~63% ice-like AT z=2cm, not 0%
  # until 2cm as a true step would be). cp0 is NOT changed (see note below).
  kd: 2.5
  use_default_H: false
  H: 0.02
  use_default_rhos: false
  rhos: 1500.0
  use_default_rhod: false
  # NOTE: real water ice rho ~920 kg/m3 (vs regolith rhos=1500).
  rhod: 920.0
  use_default_cp0: false
  # NOTE (FLAGGED): cp0 is a SINGLE global scalar in PTM3D -- there is no
  # depth-dependent heat capacity. Left at the regolith value (666.667
  # J/kg/K) to keep the near-surface (case-1-identical) regolith physics
  # exact. Real ice cp ~1500-2000 J/kg/K is NOT represented; the deep
  # "ice" layer's effective thermal inertia this model can actually produce
  # is TI=sqrt(kd*rhod*cp0)=sqrt(2.5*920*666.667)~=1238 SI, NOT the
  # target ~2000+ SI real buried ice would have (a ~40% shortfall from the
  # missing cp jump). Flagged, not silently patched.
  cp0: 666.6666666666666
  use_default_Qb: false
  Qb: 0.0
  use_default_chi: false
  # NOTE (FLAGGED): chi's T^3 radiative-conductivity term (Hayne 2017,
  # k=kc*(1+R350*T^3)) is a SINGLE global multiplier applied to kc(z) at
  # ALL depths -- it cannot be scoped to "regolith only". It will also
  # inflate the deep ice-like kd by roughly +20-50% at plausible subsurface
  # mean temperatures (~150-200K), which is unphysical for solid ice (no
  # porous radiative pathway) and has the wrong sign of T-dependence vs
  # real ice conductivity. Left at chi=2.7 (case-1-identical) rather than
  # silently zeroing it, so this is a known, quantified artifact in the
  # ice-affected depths -- NOT a code fix, flagged for Fermi/Paul.
  chi: 2.7
radiation:
  enabled: false
illumination:
  include_primary_reflection: false
  use_batch_processing: true
  albedo_map: ''
  albedo_maps_directory: ''
  positions_file: ''
output:
  directory: output/justitia/ice_2cm
  format: binary
  vtk_mode: none
  include_primary_ir: false
  thermal_vtk_file: ''
  complete_vtk_file: ''
  locations_file: ''
  depths_file: ''
  series_output: per_timestep
  location_data: ''
advanced:
  verbose: false
  default_visible_albedo: -1.0
generic_body:
  name: 269 Justitia (A887 SA)
  config_file: data/horizons_cache/bodies/269_Justitia_(A887_SA)/body_config.yaml
  ephemeris_source: spice
