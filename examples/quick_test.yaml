# PTM3D Quick Test Configuration
# Example: Fast simulation for testing and validation

simulation:
  start_time: "2025-01-01T00:00:00"
  duration_days: 0.5            # Half Europa day for quick test
  timesteps: 24                 # One output per hour
  body: "Europa"

mesh:
  resolution: 4                 # Low resolution for speed
  use_topographic: false
  import_file: ""
  scale_factor: 1.0
  export_basic: false

thermal:
  run_thermal_mesh: true
  threads: 0                    # Auto
  equilibration_orbits: 5       # Minimal equilibration
  compute_statistics: true
  thermal_inertia_map: ""
  enable_shadow_flux: false
  crater_dd_ratio: 8.0
  integration_days: 0.5
  integration_steps: -1
  integration_offset_days: 0.0
  integration_offset_steps: 0

illumination:
  include_primary_reflection: true
  use_batch_processing: true
  albedo_map: ""
  albedo_maps_directory: "data/albedo_maps"
  positions_file: ""

output:
  directory: "output/quick_test"
  format: "binary"
  vtk_mode: "thermal"           # Only thermal VTK for speed
  include_primary_ir: false
  thermal_vtk_file: ""
  complete_vtk_file: ""
  no_maps: false
  locations_file: ""
  series_output: ""
  location_data: ""

visualization:
  create: false                 # Skip visualization for speed
  width: 1024
  height: 768
  fps: 30
  camera_distance: 5.0
  camera_latitude: 30.0
  camera_longitude: 0.0
  emission_angle: -1.0
  azimuth: -1.0
  save_frames: false

advanced:
  verbose: true
  default_visible_albedo: -1.0