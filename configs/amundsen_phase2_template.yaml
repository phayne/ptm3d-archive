# Amundsen Crater Thermal + Radiation - Phase 2 Template
# Placeholder {START_TIME} is replaced by the thermal series script for each lunation
simulation:
  start_time: '{START_TIME}'
  duration_days: 29.530588
  timesteps: 360
  body: Moon
mesh:
  resolution: 5
  import_file: /tmp/amundsen_mesh.ply
  scale_factor: 1.0
thermal:
  run_thermal_mesh: true
  threads: 0
  equilibration_cycles: 2
  equilibration_orbits: 2.0
  use_gpu: true
  compute_statistics: true
  thermal_inertia_map: ''
  enable_shadow_flux: false
  crater_dd_ratio: 8.0
  integration_days: -1.0
  integration_steps: -1
  integration_offset_days: 0.0
  integration_offset_steps: 0
  geothermal_heat_flow: -1.0
thermophysical:
  use_default_albedo: true
  albedo: 0.12
  use_default_emissivity: true
  emissivity: 0.95
  incidence_angle_albedo: true
  use_default_ks: true
  ks: 0.00074
  use_default_kd: true
  kd: 0.0034
  use_default_H: true
  H: 0.06
  use_default_rhos: true
  rhos: 1100.0
  use_default_rhod: true
  rhod: 1800.0
  use_default_cp0: true
  cp0: 800.0
  use_default_Qb: true
  use_default_chi: true
  chi: 2.7
radiation:
  enabled: true
  min_shadow_fraction: 0.3
  verbose: false
  use_gpu: false
  view_factor_file: '{VIEW_FACTOR_FILE}'
  max_coupling_iterations: 3
  coupling_temp_threshold: 0.5
  coupling_flux_threshold: 0.1
  coupling_face_fraction: 0.01
  use_hmatrix: true
  use_aca: true
  aca_tolerance: 0.001
  aca_max_rank: 50
  hmatrix_threads: 0
  adaptive_neighbors: true
  captured_energy_target: 0.95
  max_neighbors: 500
  min_neighbors: 20
  # ---- Smith (1967) beamed thermal emission ------------------------------
  # Amundsen is a lunar polar crater, and beaming is standard for lunar polar
  # configurations (Paul, 2026-08-25). It is left OFF here pending Paul's word:
  # this template drives a campaign whose earlier lunations were run Lambertian
  # and whose radiation-on reruns are on hold. To enable, UNCOMMENT BOTH lines.
  #
  # ⚠️ Both keys stay COMMENTED OUT rather than written as `beaming: false` +
  # a slope. On a binary older than 2026-08-25 there is no `beaming` key at all
  # and `rms_slope_deg > 0` IS the switch, so a committed nonzero slope would
  # silently turn beaming ON there while this file appears to say it is off.
  #
  # ⚠️ Cost on THIS template is unmeasured. It runs CPU radiosity
  # (use_gpu: false) with min_shadow_fraction 0.3, so its receiver set is wider
  # than the 0.8 case the +22% figure was measured on. Measure with a short run
  # and read the engine's [beam-cost] line before committing a campaign.
  # See docs/radiation-exchange.md section 8.
  # beaming: true
  # rms_slope_deg: 32.5      # Jhoti et al. (2024) Table 1, lunar highlands
illumination:
  include_primary_reflection: true
  use_batch_processing: true
  use_albedo_map: true
  albedo_map: ''
  albedo_maps_directory: data/albedo_maps
  positions_file: ''
output:
  directory: '{OUTPUT_DIR}'
  format: binary
  vtk_mode: both
  include_primary_ir: true
  thermal_vtk_file: ''
  complete_vtk_file: ''
  locations_file: '{LOCATIONS_FILE}'
  depths_file: ''
  series_output: 'location_timeseries.csv'
  location_data: ''
advanced:
  verbose: false
  default_visible_albedo: -1.0
