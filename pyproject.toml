[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptm"
# Single-sourced from ptm/__init__.py. A literal here goes stale the moment
# anyone bumps __version__ and nothing complains: this file said 0.1.0 while
# the package reported 0.3.0, so `pip show ptm` and `ptm --version` disagreed.
dynamic = ["version"]
description = "Python layer for PTM3D: read a run directory, launch the engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Paul O. Hayne", email = "paul.hayne@colorado.edu" }]
keywords = ["planetary", "thermal", "thermophysical", "PTM3D"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
]

# The C++ engine is the model; this package reads what it writes and starts it.
# There is no compiled extension here and no build-time dependency on the
# engine -- `pip install -e .` works in a checkout that has never been built.
dependencies = [
    "numpy>=1.20",       # imported by ptm.results and ptm.readers
    "pyyaml>=5.4",       # imported by ptm.engine_config (config inspection)
    "matplotlib>=3.4",   # imported by ptm.plots; 3.4 is where FuncNorm arrived
]

[project.scripts]
# `ptm info <run>` and `ptm plot <run> map --save f.png` are the shell route
# from a finished run to a picture. Nothing else in the tree provides one.
ptm = "ptm.cli:main"

[project.optional-dependencies]
# Regridding a mesh to a raster (ptm.results.MeshRegridder) needs a KD-tree and
# a Delaunay triangulation. Everything else in ptm.results works without it.
regrid = ["scipy>=1.7"]

[project.urls]
Homepage = "https://github.com/phayne/ptm3d"
Issues = "https://github.com/phayne/ptm3d/issues"

[tool.setuptools]
package-dir = { "" = "src/python" }
# Listed explicitly: src/python also holds ~110 loose modules and two further
# packages (ptm_ice, ojakangas_stevenson) that are not part of this
# distribution.
#
# damit and horizons ARE, as of the tutorial-04 work: they are the small-body
# preset half of the workflow (DAMIT shape search and conversion; the HORIZONS
# client, SPK generator and body-config writer), and tutorial 04 was doing
# sys.path surgery for the single line `from damit import DAMITClient`. Both
# import nothing outside the standard library except a guarded `yaml`, which is
# already a dependency, so packaging them adds no requirement.
packages = ["ptm", "damit", "horizons"]

[tool.setuptools.dynamic]
version = { attr = "ptm.__version__" }
